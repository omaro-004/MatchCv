# config/services.yaml
# (extrait — ajouter/fusionner ces lignes à votre services.yaml existant)
#
# Symfony 6/7 : l'autowiring est activé par défaut pour tout le namespace App\.
# La seule configuration explicite nécessaire est le tag kernel.event_subscriber
# sur le FaceIdListener, plus la liaison de l'argument scalaire $anthropicApiKey
# du nouveau service CvAiProfileAnalyzer.

services:

    # ── Déclarations existantes (ne pas modifier) ──────────────────
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # ── LoginSuccessHandler ──────────────────────────────
    App\Handlers\LoginSuccessHandler:
        arguments:
            $router: '@router'

    # ── FaceIdListener (Event Subscriber) ───────────────
    App\EventListener\FaceIdListener:
        arguments:
            $tokenStorage: '@security.token_storage'
            $router: '@router'
        tags:
            - { name: kernel.event_subscriber }

    # ── NOUVEAU : CvAiProfileAnalyzer ──────────────────────────────
    # Service d'analyse IA du profil candidat (parsing du CV PDF +
    # données du formulaire d'inscription). Utilise l'API GRATUITE de
    # Groq (https://console.groq.com). La clé API est lue depuis la
    # variable d'environnement GROQ_API_KEY (voir .env / .env.local).
    App\Service\CvAiProfileAnalyzer:
        arguments:
            $groqApiKey: '%env(GROQ_API_KEY)%'

    # ── NOUVEAU : MatchingService (score IA candidat ↔ offre) ──────
    App\Service\MatchingService:
        arguments:
            $groqApiKey: '%env(GROQ_API_KEY)%'